{% extends 'monApp/base.html' %}

{% block menu %}
    <h1>Liste des statuts</h1>
    {% endblock %}
{% block contenu %}
        <p>Mes Statuts sont :</p>
        <table class="table">
        <thead>
        <th>Id</th>
        <th>Nom Statut</th>
        </thead>
        <tbody>
        {% for stt in stts %}
        <tr>
        <td>{{ stt.idStatut }} </td>
        <td>{{ stt.libelle }} </td>
        </tr>
        {% endfor %}
        </tbody>
    </table>
{% endblock %}
