{% extends 'monApp/base.html' %}
{% block contenu %}
<h1> Suppression d'un statut </h1>
<form action="" method="post">
    {% csrf_token %}
    <p>Etes-vous sûr de vouloir supprimer le produit {{ object.produit.intituleProd }} du rayon {{ object.rayon.nomRayon}} ?</p>
    <button type="submit" class="btn btn-success mt-2">Confirmer</button>
</form>
<a href="{% url 'dtl_rayon' object.rayon.idRayon %}" class="btn btn-info">Annuler</a>
{% endblock %}
